name: Deploy Comissions to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify application
        run: |
          node --check dist/commission-schedule.js
          node --check dist/contract-terms.js
          node --check dist/mobile.js
          node --check dist/app.js
          node --check dist/sales.js
          node --check dist/commission-pdf.js
          node --check dist/auth.js
          node --check dist/portal.js
          node --check dist/settings.js
          node checks/sales.cjs
          node checks/access.cjs
          node checks/users.cjs
          node checks/foundation.cjs
          node checks/portal-api.cjs
          node checks/settings.cjs
          node checks/draft-save.cjs
          node checks/sale-flow.cjs
          node checks/contract-terms.cjs
          node checks/financial-parity.cjs
          node checks/commission-schedule.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
